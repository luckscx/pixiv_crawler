<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>抓</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container text-center">
        <label for="input-data">输入Pixiv地址</label>
        <input type="text" class="form-control" id="input-data" placeholder="url">
        <button class="btn btn-success" type="button"  onclick="submitData()">Go</button>
        <span><a href="/book">列表</a></span>
        <pre id="output"></pre>
        <div id="downloads" class="mt-2"></div>
    </div>
    <script>
        async function submitData() {
            const inputData = document.getElementById("input-data").value;
            const outputElement = document.getElementById('output');
            const downloadsElement = document.getElementById('downloads');
            outputElement.textContent = '开始\n';
            downloadsElement.innerHTML = '';

            // 创建 EventSource 连接
            const eventSource = new EventSource(`/events?url=${inputData}`); // 替换 your_url

            // 处理接收到的数据
            eventSource.onmessage = function(event) {
                const data = event.data;
                if (data.startsWith('DOWNLOAD:')) {
                    // 任务完成，渲染可点击的下载链接
                    try {
                        const info = JSON.parse(data.slice('DOWNLOAD:'.length));
                        const a = document.createElement('a');
                        a.href = info.url;
                        a.textContent = '下载 ' + info.name;
                        a.setAttribute('download', info.name);
                        a.className = 'btn btn-primary d-block my-1';
                        downloadsElement.appendChild(a);
                    } catch (e) {
                        console.error('解析下载链接失败', e);
                    }
                    return;
                }
                outputElement.textContent += data + '\n'; // 显示每一行
            };

            // 处理连接关闭
            eventSource.onerror = function() {
                console.error('EventSource failed.');
                eventSource.close();
            };
        }
    </script>
</body>
</html>
